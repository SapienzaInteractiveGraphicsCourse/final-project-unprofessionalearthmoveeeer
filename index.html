<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kazakhstan Driving Exam Simulator — B Category, Astana</title>
  <style>
    :root { --hud-bg: rgba(20, 24, 33, 0.78); }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0e14; }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }

    .panel {
      position: fixed;
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      font-size: 13px; color: #e7ecf3;
      background: var(--hud-bg); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px; padding: 10px 14px; line-height: 1.55;
      backdrop-filter: blur(6px); pointer-events: none; user-select: none;
    }
    #hud { top: 12px; left: 12px; min-width: 210px; }
    #hud h1 { font-size: 13px; font-weight: 700; color: #ffd166; margin-bottom: 6px; }
    #hud .row { display: flex; justify-content: space-between; gap: 16px; }
    #hud .row span:first-child { color: #9aa7b8; }
    #hud b { color: #ffd166; font-weight: 700; }

    #help { bottom: 12px; left: 12px; color: #c2ccda; }
    #help kbd {
      background: #2a3240; border: 1px solid rgba(255,255,255,0.12);
      border-radius: 4px; padding: 0 5px; color: #fff; font-size: 12px;
    }

    /* Examiner panel (top-right) */
    #exam { top: 12px; right: 12px; min-width: 230px; }
    #exam h1 { font-size: 13px; font-weight: 700; color: #ff9f68; margin-bottom: 6px; }
    #exam .row { display: flex; justify-content: space-between; gap: 16px; }
    #exam .row span:first-child { color: #9aa7b8; }
    #exam .big { font-size: 22px; font-weight: 800; }
    #exam .pts { color: #6fe08a; }            /* green when clean */
    #exam .pts.warn { color: #ffd166; }
    #exam .pts.bad { color: #ff6b6b; }
    #exam .viol { color: #ff9aa2; font-size: 12px; margin-top: 4px; min-height: 16px; }

    /* Centre prompt (start command / emergency stop) */
    #prompt {
      position: fixed; top: 64px; left: 50%; transform: translateX(-50%);
      font-family: ui-monospace, Consolas, monospace; font-size: 18px; font-weight: 700;
      color: #fff; background: rgba(20,24,33,0.82); border: 1px solid rgba(255,255,255,0.12);
      padding: 8px 18px; border-radius: 10px; pointer-events: none; user-select: none;
      text-align: center; transition: opacity .2s; opacity: 0;
    }
    #prompt.show { opacity: 1; }
    #prompt.alert { color: #ffd166; border-color: #ffae3b; }

    /* Result overlay */
    #result {
      position: fixed; inset: 0; display: none; place-items: center; z-index: 9;
      background: rgba(8,10,14,0.55); backdrop-filter: blur(3px);
      font-family: ui-monospace, Consolas, monospace; color: #fff;
    }
    #result.show { display: grid; }
    #result .card {
      background: rgba(20,24,33,0.95); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px; padding: 28px 40px; text-align: center; min-width: 320px;
    }
    #result .verdict { font-size: 40px; font-weight: 900; letter-spacing: 1px; }
    #result .verdict.pass { color: #6fe08a; }
    #result .verdict.fail { color: #ff6b6b; }
    #result .detail { color: #c2ccda; margin-top: 10px; line-height: 1.6; }
    #result .hint { color: #8d99ab; margin-top: 14px; font-size: 13px; }

    #loading {
      position: fixed; inset: 0; display: grid; place-items: center;
      font-family: ui-monospace, Consolas, monospace; color: #9aa7b8;
      background: #0b0e14; transition: opacity .4s ease; z-index: 10;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
  </style>

  <!--
    No build step: ES modules + import map, all libraries vendored under /lib.
    This runs directly on GitHub Pages (and any static server).
  -->
  <script type="importmap">
  {
    "imports": {
      "three": "./lib/three/three.module.js",
      "three/addons/": "./lib/three/addons/",
      "@tweenjs/tween.js": "./lib/tween/tween.esm.js"
    }
  }
  </script>
</head>
<body>
  <div id="app"></div>

  <div id="hud" class="panel">
    <h1>Astana Practical Exam — B category</h1>
    <div class="row"><span>Speed</span><span><b id="hud-speed">0</b> km/h</span></div>
    <div class="row"><span>Gear</span><b id="hud-gear">D</b></div>
    <div class="row"><span>Camera</span><b id="hud-camera">chase</b></div>
    <div class="row"><span>Headlights</span><b id="hud-lights">OFF</b></div>
    <div class="row"><span>Seatbelt</span><b id="hud-belt">OFF</b></div>
    <div class="row"><span>Signal</span><b id="hud-signal">—</b></div>
  </div>

  <div id="exam" class="panel">
    <h1>Examiner</h1>
    <div class="row"><span>Penalty</span><b class="big pts" id="hud-penalty">0</b></div>
    <div class="row"><span>Time left</span><b id="hud-time">4:00</b></div>
    <div class="row"><span>Cones hit</span><b id="hud-cones">0 / 0</b></div>
    <div class="viol" id="hud-viol"></div>
  </div>

  <div id="prompt"></div>

  <div id="result">
    <div class="card">
      <div class="verdict" id="result-verdict">—</div>
      <div class="detail" id="result-detail"></div>
      <div class="hint">Press <b>R</b> to restart the exam</div>
    </div>
  </div>

  <div id="help" class="panel">
    <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> drive ·
    <kbd>Q</kbd>/<kbd>E</kbd> signal · <kbd>H</kbd> hazard · <kbd>B</kbd> belt ·
    <kbd>C</kbd> cam · <kbd>L</kbd> lights · <kbd>O</kbd> doors · <kbd>Enter</kbd> finish · <kbd>R</kbd> reset
  </div>

  <div id="loading">Loading…</div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
